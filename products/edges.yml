# Who may call whom, by product id. The one reviewable place for rule R2 of docs/ARCHITECTURE.md: a product's identity.calls must name
# only audiences of products listed here. Data calls nothing: it works without Agents and never depends on it. Nothing may call
# the control plane or a solution, so they never appear on the right.
chat: [agents]
agents: [data]
data: []
# Optional edges that exist only in a product's browser app, and only when the app is given the callee's address. The server never
# calls, and the product works alone without it. Data's Home page has an "Ask anything" box that talks to Agents.
_optional_web:
  data: [agents]
