# Copy to group_vars/all/secrets.yml (git ignores it). Keys that must never go in git, chat or the other files.
# Google sign-in: from Google Cloud Console > APIs & Services > Credentials > your OAuth client. Add this to its
# "Authorized redirect URIs": https://auth.example.com/realms/loamz/broker/google/endpoint (your auth_domain).
google_client_id: ""
google_client_secret: ""
# The password for smtp_user, if you turned email on.
smtp_password: ""
# The key of the provider named in agents_model (the others can stay empty). Only on this machine's settings; never printed or committed.
openai_api_key: ""
groq_api_key: ""
gemini_api_key: ""
openrouter_api_key: ""
