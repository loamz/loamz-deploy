- name: Docker
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Docker is running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/keycloak, mode: "0700" }
    # Keycloak runs as an ordinary user inside its container and must be able to read the realm to import it.
    - { path: /etc/keycloak/import, mode: "0755" }

# Made here, once, and kept only on this machine (backup-secrets.yml copies them to you).
- name: Keycloak's database password and administrator password, made once
  ansible.builtin.shell: |
    umask 077
    openssl rand -hex 24 > /etc/keycloak/db-password
    openssl rand -hex 16 > /etc/keycloak/admin-password
  args:
    creates: /etc/keycloak/admin-password

- name: Read the database password
  ansible.builtin.slurp:
    src: /etc/keycloak/db-password
  register: kc_db_password
  no_log: true

- name: Keycloak's database user
  become_user: postgres
  community.postgresql.postgresql_user:
    name: keycloak
    password: "{{ kc_db_password.content | b64decode | trim }}"
  no_log: true

- name: Keycloak's database
  become_user: postgres
  community.postgresql.postgresql_db:
    name: keycloak
    owner: keycloak

- name: The realm (people, the chat app, Google sign-in), imported the first time Keycloak starts
  ansible.builtin.template:
    src: realm-loamz.json.j2
    dest: /etc/keycloak/import/realm-loamz.json
    mode: "0644"

- name: Read the administrator password
  ansible.builtin.slurp:
    src: /etc/keycloak/admin-password
  register: kc_admin_password
  no_log: true

# Written with its content (not by a script), so it only counts as a change, and restarts Keycloak, when something
# in it really changed.
- name: The settings Keycloak starts with
  ansible.builtin.copy:
    dest: /etc/keycloak/keycloak.env
    mode: "0600"
    content: |
      KC_BOOTSTRAP_ADMIN_USERNAME=admin
      KC_BOOTSTRAP_ADMIN_PASSWORD={{ kc_admin_password.content | b64decode | trim }}
      KC_DB_PASSWORD={{ kc_db_password.content | b64decode | trim }}
      GOOGLE_CLIENT_ID={{ google_client_id }}
      GOOGLE_CLIENT_SECRET={{ google_client_secret }}
      SMTP_PASSWORD={{ smtp_password }}
  no_log: true
  notify: Restart keycloak

- name: Service definition
  ansible.builtin.template:
    src: keycloak.service.j2
    dest: /etc/systemd/system/keycloak.service
    mode: "0644"
  notify: Restart keycloak

- name: Running, and on at every boot
  ansible.builtin.systemd:
    name: keycloak
    state: started
    enabled: true
    daemon_reload: true

- name: Keycloak is answering (the first start builds itself and takes a minute or two)
  ansible.builtin.uri:
    url: http://127.0.0.1:8081/realms/loamz/.well-known/openid-configuration
  register: kc_up
  until: kc_up.status == 200
  retries: 60
  delay: 5

# The realm file is read only on the first start, so later settings (profile picture, "delete my account") are applied here,
# every time, by a script that changes only what is missing.
- name: The realm has every setting the app needs
  ansible.builtin.script: >-
    files/settle.py --url http://127.0.0.1:8081 --password-file /etc/keycloak/admin-password
    --secret-dir /etc/loamz-agents/clients
    {% for ag in agents | default([]) %}--agent '{{ ag.name }}:{{ ag.email }}:{{ ag.display }}:{{ ag.org | default("loamz-agents") }}:{{ ag.chat_tenant | default("") }}' {% endfor %}
  args:
    executable: python3
  register: settled
  changed_when: "'changed: nothing' not in settled.stdout"
