- name: Where dumps go
  ansible.builtin.file:
    path: /var/backups/loamz-chat
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: The backup key (made once, never replaced)
  ansible.builtin.shell: |
    umask 077
    [ -s /etc/loamz-chat/backup.key ] || openssl rand -base64 48 > /etc/loamz-chat/backup.key
  args:
    creates: /etc/loamz-chat/backup.key

# Ubuntu's rclone is built without the Oracle backend, so install the official build (pinned) beside it.
- name: unzip
  ansible.builtin.apt:
    name: unzip
    state: present

- name: Official rclone
  ansible.builtin.unarchive:
    src: "https://downloads.rclone.org/v{{ rclone_version }}/rclone-v{{ rclone_version }}-linux-arm64.zip"
    dest: /tmp
    remote_src: true
    creates: "/tmp/rclone-v{{ rclone_version }}-linux-arm64/rclone"

- name: Put it first on the path
  ansible.builtin.copy:
    src: "/tmp/rclone-v{{ rclone_version }}-linux-arm64/rclone"
    dest: /usr/local/bin/rclone
    mode: "0755"
    remote_src: true

# Backblaze B2 (S3 API): keys come from group_vars/all/b2.env (git-ignored, never printed). Without that file there is no off-machine copy.
- name: B2 credentials, if present
  ansible.builtin.set_fact:
    b2_key: "{{ lookup('ansible.builtin.ini', 'KEY_ID type=properties file=' ~ playbook_dir ~ '/group_vars/all/b2.env', errors='ignore') }}"
    b2_secret: "{{ lookup('ansible.builtin.ini', 'APPLICATION_KEY type=properties file=' ~ playbook_dir ~ '/group_vars/all/b2.env', errors='ignore') }}"
    b2_endpoint: "{{ lookup('ansible.builtin.ini', 'BUCKET_ENDPOINT type=properties file=' ~ playbook_dir ~ '/group_vars/all/b2.env', errors='ignore') }}"
    b2_bucket: "{{ lookup('ansible.builtin.ini', 'BUCKET_NAME type=properties file=' ~ playbook_dir ~ '/group_vars/all/b2.env', errors='ignore') }}"
  no_log: true

- name: rclone config folder
  ansible.builtin.file:
    path: /root/.config/rclone
    state: directory
    mode: "0700"

- name: rclone remote for B2
  ansible.builtin.copy:
    dest: /root/.config/rclone/rclone.conf
    content: |
      [b2]
      type = s3
      provider = Other
      access_key_id = {{ b2_key }}
      secret_access_key = {{ b2_secret }}
      endpoint = {{ b2_endpoint if '://' in b2_endpoint else 'https://' ~ b2_endpoint }}
      acl = private
      no_check_bucket = true

      [oci]
      type = oracleobjectstorage
      provider = instance_principal_auth
      namespace = {{ oci_namespace }}
      region = {{ oci_region }}
      compartment = {{ oci_compartment | default('') }}
      storage_tier = Archive
      no_check_bucket = true
    mode: "0600"
  when: b2_key | length > 0
  no_log: true

- name: Restore script
  ansible.builtin.template:
    src: restore.sh.j2
    dest: /usr/local/bin/loamz-chat-restore
    mode: "0750"

- name: Nightly dump script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: /usr/local/bin/loamz-chat-backup
    mode: "0750"

- name: Timer and service
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.body }}"
    mode: "0644"
  loop:
    - name: loamz-chat-backup.service
      body: |
        [Unit]
        Description=Dump the Loamz Chat database
        [Service]
        Type=oneshot
        ExecStart=/usr/local/bin/loamz-chat-backup
    - name: loamz-chat-backup.timer
      body: |
        [Unit]
        Description=Nightly Loamz Chat backup
        [Timer]
        OnCalendar=*-*-* 03:15:00
        RandomizedDelaySec=15min
        Persistent=true
        [Install]
        WantedBy=timers.target

- name: Timer on
  ansible.builtin.systemd:
    name: loamz-chat-backup.timer
    state: started
    enabled: true
    daemon_reload: true
