- name: Packages
  ansible.builtin.apt:
    name: [rsync, ufw, fail2ban, unattended-upgrades, curl, openssl, rclone]
    state: present
    update_cache: true
    cache_valid_time: 3600

# Oracle's Ubuntu images ship a rule that rejects everything but SSH ahead of anything ufw adds.
- name: Oracle's own firewall rules are replaced by ufw's
  ansible.builtin.shell: |
    iptables -D INPUT -j REJECT --reject-with icmp-host-prohibited 2>/dev/null || true
    iptables -D FORWARD -j REJECT --reject-with icmp-host-prohibited 2>/dev/null || true
    [ -f /etc/iptables/rules.v4 ] && sed -i '/-j REJECT --reject-with icmp-host-prohibited/d' /etc/iptables/rules.v4 || true
  changed_when: false

- name: Only SSH and the web are reachable from outside
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80", "443"]

- name: Firewall on, everything else refused
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: SSH accepts keys only
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/10-loamz.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
    mode: "0644"
    validate: sshd -t -f %s
  notify: Restart ssh

- name: fail2ban watches SSH
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Security updates install themselves
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"

- name: A little swap, so a memory spike slows things instead of killing them
  ansible.builtin.shell: |
    fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
    echo '/swapfile none swap sw 0 0' >> /etc/fstab
  args:
    creates: /swapfile

- name: A user with no login and no shell for the server
  ansible.builtin.user:
    name: loamz-chat
    system: true
    shell: /usr/sbin/nologin
    home: /var/lib/loamz-chat

- name: Where settings and secrets live
  ansible.builtin.file:
    path: /etc/loamz-chat
    state: directory
    owner: root
    group: loamz-chat
    mode: "0750"
