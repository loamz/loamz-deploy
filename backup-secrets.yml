# Copies the server's secrets to THIS computer, once. Keep that copy somewhere safe and private (a password manager
# attachment, an encrypted drive). Anyone holding the authority key can issue device identities; losing it means every
# person must set their devices up again.
- name: Fetch the server's secrets
  hosts: chat
  become: true
  tasks:
    - ansible.builtin.fetch:
        src: "{{ item }}"
        dest: secrets-backup/
        flat: false
      loop: [/etc/loamz-chat/secrets.env, /etc/loamz-chat/db-password, /etc/keycloak/admin-password, /etc/keycloak/db-password]
      no_log: true
