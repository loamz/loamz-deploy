# Copies the server's secrets to THIS computer, once (and again whenever one changes). Keep that copy somewhere safe and private
# (a password manager attachment, an encrypted drive). Anyone holding the authority key can issue device identities; losing it
# means every person must set their devices up again. Losing the agents' sealing key means the conversations and connector
# tokens the agents server stored can never be opened again.
- name: Fetch the server's secrets
  hosts: chat
  become: true
  tasks:
    - ansible.builtin.fetch:
        src: "{{ item }}"
        dest: secrets-backup/
        flat: false
      loop: [/etc/loamz-chat/secrets.env, /etc/loamz-chat/db-password, /etc/loamz-chat/backup.key, /etc/keycloak/admin-password, /etc/keycloak/db-password]
      no_log: true

    # The agents server: the key that seals what it stores, its database password, the chat bridge's state keys, and the agents' client secrets.
    - name: Find the agents' secrets
      ansible.builtin.find:
        paths: /etc/loamz-agents
        patterns: ["sealing.key", "db-password", "bridge-*.key", "*.secret"]
        recurse: true
      register: agents_secrets

    - name: The sealing key must be among them
      ansible.builtin.assert:
        that: agents_secrets.files | map(attribute='path') | select('equalto', '/etc/loamz-agents/sealing.key') | list | length == 1
        fail_msg: "/etc/loamz-agents/sealing.key was not found. Do not go on without it, because it cannot be made again."
        quiet: true

    - ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: secrets-backup/
        flat: false
      loop: "{{ agents_secrets.files }}"
      loop_control:
        label: "{{ item.path }}"
      no_log: true
